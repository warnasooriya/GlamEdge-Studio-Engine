# Full GlamEdge stack: datastores, API, web, and a TLS-terminating edge proxy.
#
#   Local:      docker compose up -d --build          (HTTP on http://localhost)
#   Production: see README "Deploying with Docker" — set DOMAIN + NGINX_TEMPLATE=https
#               in .env, run scripts/init-letsencrypt.sh, then bring the stack up.
#
# Config comes from a .env file next to this one; copy .env.docker.example.

name: glamedge

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # Defaults assume a much larger host. On a 1GB box the default 128M buffer
    # pool plus per-connection buffers is enough to trigger the OOM killer, which
    # takes the whole stack with it. These are floors, not tuning for throughput —
    # raise them on a bigger instance.
    command:
      - --innodb-buffer-pool-size=64M
      - --max-connections=50
      - --performance-schema=OFF
    deploy:
      resources:
        limits:
          memory: ${MYSQL_MEM_LIMIT:-288M}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-glamedge_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-glamedge}
      MYSQL_USER: ${MYSQL_USER:-glamedge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-glamedge_pw}
    # Bound to loopback: reachable from this host for admin tooling, never from
    # the public internet. Remove the mapping entirely to lock it to the network.
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-glamedge_root}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [glamedge]

  mongo:
    image: mongo:7
    restart: unless-stopped
    # WiredTiger otherwise reserves ~50% of host RAM for its cache.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    deploy:
      resources:
        limits:
          memory: ${MONGO_MEM_LIMIT:-256M}
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [glamedge]

  redis:
    # alpine over the debian image: 59MB vs 192MB, and this only holds OTP codes.
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-64M}
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [glamedge]

  api:
    # IMAGE_PREFIX/IMAGE_TAG are set by CI so the server pulls a prebuilt image
    # instead of compiling on the box. Locally they are unset and compose builds
    # from source, tagging the result with this same name.
    image: ${IMAGE_PREFIX:-glamedge}/api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: ${API_MEM_LIMIT:-288M}
    environment:
      NODE_ENV: production
      # Keep V8's heap under the container limit so it GCs rather than being
      # OOM-killed. Sharp's image work is the main spike.
      NODE_OPTIONS: --max-old-space-size=256
      PORT: 4000
      # Service names, not localhost — these resolve on the compose network.
      DATABASE_URL: mysql://${MYSQL_USER:-glamedge}:${MYSQL_PASSWORD:-glamedge_pw}@mysql:3306/${MYSQL_DATABASE:-glamedge}?connection_limit=20&pool_timeout=30
      MONGODB_URI: mongodb://mongo:27017/${MONGO_DATABASE:-glamedge_feed}
      REDIS_URL: redis://redis:6379
      # Same origin as the browser uses, since nginx serves app and API together.
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      OTP_PROVIDER: ${OTP_PROVIDER:-console}
      TEXTLK_API_TOKEN: ${TEXTLK_API_TOKEN:-}
      TEXTLK_SENDER_ID: ${TEXTLK_SENDER_ID:-}
      NOTIFYLK_USER_ID: ${NOTIFYLK_USER_ID:-}
      NOTIFYLK_API_KEY: ${NOTIFYLK_API_KEY:-}
      NOTIFYLK_SENDER_ID: ${NOTIFYLK_SENDER_ID:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_CLOUDFRONT_URL: ${AWS_CLOUDFRONT_URL:-}
      WHATSAPP_CLOUD_API_TOKEN: ${WHATSAPP_CLOUD_API_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      # Primary bill-sending path — see apps/whatsapp-web/README.md. Left
      # blank, sendWhatsAppText/Image fall straight through to the Cloud API
      # above, so an unconfigured or crash-looping whatsapp-web service never
      # blocks a deploy or a bill from going out.
      WHATSAPP_WEB_SERVICE_URL: ${WHATSAPP_WEB_SERVICE_URL:-http://whatsapp-web:5000}
      WHATSAPP_WEB_INTERNAL_SECRET: ${WHATSAPP_WEB_INTERNAL_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@glamedge.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      # Only used when S3 is unconfigured; keeps uploaded media across rebuilds.
      - api_uploads:/app/apps/api/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [glamedge]

  # Drives a real WhatsApp Web session (Chromium via puppeteer) instead of
  # Meta's Cloud API, so bills can go out without business verification. Kept
  # as its own service, not bundled into apps/api, specifically so an
  # unofficial-library crash or its ~300MB Chromium footprint can never take
  # down bookings or payments — see apps/whatsapp-web/README.md, including
  # the memory budget this assumes and why it needs a bigger instance than
  # the one this stack was originally tuned for.
  whatsapp-web:
    image: ${IMAGE_PREFIX:-glamedge}/whatsapp-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/whatsapp-web/Dockerfile
    restart: unless-stopped
    # Chromium needs real shared memory to render — Docker's 64MB default is
    # too small and causes silent renderer crashes.
    shm_size: 512m
    deploy:
      resources:
        limits:
          memory: ${WHATSAPP_WEB_MEM_LIMIT:-450M}
    environment:
      PORT: 5000
      # No `:?required` here on purpose: an empty secret makes THIS container
      # crash-loop (see apps/whatsapp-web/src/config.ts) rather than failing
      # `docker compose up` for every other service too. Generate one with
      # `openssl rand -hex 32` and set it in .env before relying on this path.
      WHATSAPP_WEB_INTERNAL_SECRET: ${WHATSAPP_WEB_INTERNAL_SECRET:-}
      SESSION_DATA_PATH: /app/apps/whatsapp-web/.wwebjs_auth
    volumes:
      # Session login persists here — without this volume, every redeploy
      # would log the salon's WhatsApp out and require rescanning the QR code.
      - whatsapp_web_session:/app/apps/whatsapp-web/.wwebjs_auth
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [glamedge]

  web:
    image: ${IMAGE_PREFIX:-glamedge}/web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Relative by default so the bundle is domain-agnostic; nginx routes
        # /api and /socket.io to the API on the same origin.
        VITE_API_URL: ${VITE_API_URL:-/}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-/}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    networks: [glamedge]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api, web]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      # Restricts envsubst to variables whose name matches, so nginx's own
      # $host / $uri / $scheme are left untouched in the template.
      NGINX_ENVSUBST_FILTER: DOMAIN
    # Renders the config template and adds a periodic reload for cert renewals.
    entrypoint: ["/docker-entrypoint-glamedge.sh"]
    volumes:
      # NGINX_TEMPLATE picks the http (no TLS) or https (TLS) config set.
      - ./nginx/templates/${NGINX_TEMPLATE:-http}:/etc/nginx/templates:ro
      - ./nginx/includes:/etc/nginx/includes:ro
      - ./nginx/entrypoint.sh:/docker-entrypoint-glamedge.sh:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks: [glamedge]

  # Renews certificates twice a day (Let's Encrypt renews within 30 days of
  # expiry; checking more often than needed is harmless and survives downtime).
  # Issue the first certificate with scripts/init-letsencrypt.sh.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    # Only started with `--profile tls`, so a 288MB image is not pulled onto a
    # small box before there is a domain to issue a certificate for.
    # scripts/init-letsencrypt.sh enables it as part of the HTTPS switch.
    profiles: [tls]
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done"
    networks: [glamedge]

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  api_uploads:
  whatsapp_web_session:
  certbot_conf:
  certbot_www:

networks:
  glamedge:
    driver: bridge
